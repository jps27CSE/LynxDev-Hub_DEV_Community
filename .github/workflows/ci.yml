name: CI

on:
  workflow_dispatch:
  pull_request:
    # development-branch is where all feature work lands. CI that only runs on
    # master is indistinguishable from no CI — the gate never observes a
    # regression until it reaches the long-lived branch.
    branches: [master, development-branch]
  push:
    branches: [master, development-branch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: CI/CD
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # MUST run after Build: scripts/check-blog-toc.ts reads the prerendered
      # HTML in .next/server/app/blog, so it reports "no prerendered HTML" on a
      # tree that has not been built yet. Before it was wired up, a renamed TOC
      # anchor rendered as a link that navigated nowhere and nothing caught it.
      - name: Blog TOC check
        run: npm run check:blog-toc
