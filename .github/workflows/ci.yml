name: CI

on:
  workflow_dispatch:
  pull_request:
    # development-branch is where all feature work lands. CI that only runs on
    # master is indistinguishable from no CI — the gate never observes a
    # regression until it reaches the long-lived branch.
    branches: [master, development-branch]
  push:
    branches: [master, development-branch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: CI/CD
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gated at `high`, deliberately. Plain `npm audit` exits 1 today: 6
      # remaining advisories, all moderate/low, all in dev-only tooling
      # (drizzle-kit -> @esbuild-kit -> esbuild) plus low-severity dompurify
      # and monaco-editor. Gating on those would mean red CI on a commit that
      # changed no code — the state §1 of the gap report calls worse than no
      # gate at all, because it teaches you to ignore the thing that matters.
      #
      # `high` still catches the class that actually bit here. On
      # development-branch this found 3 critical / 11 high, including
      # "@clerk/nextjs middleware-based route protection bypass" and several
      # "Next.js middleware/proxy bypass in App Router" advisories. Both target
      # proxy.ts, which IS this app's auth boundary. Patched in the same commit
      # that added this step, because a gate and the patch that makes it pass
      # are not separable — adding it first would have been permanently red.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Catches a schema change committed without its migration. Nothing else
      # in this workflow notices that: tsc passes, the tests pass, the build
      # succeeds and the route table is unchanged — then the app fails at
      # runtime, in production, on the first query touching the new column.
      #
      # Needs DATABASE_URL (already set above) but no live connection; generate
      # diffs config/schema.tsx against the on-disk snapshots in drizzle/meta.
      - name: Migration drift check
        run: npm run check:migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # Before Build on purpose: the whole suite runs in well under a second,
      # so a regression should fail in seconds rather than after a 2-minute
      # build. Nothing here needs a database.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # MUST run after Build: scripts/check-blog-toc.ts reads the prerendered
      # HTML in .next/server/app/blog, so it reports "no prerendered HTML" on a
      # tree that has not been built yet. Before it was wired up, a renamed TOC
      # anchor rendered as a link that navigated nowhere and nothing caught it.
      - name: Blog TOC check
        run: npm run check:blog-toc
